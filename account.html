<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account - ATBU BINGE MULTI BUSINESS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800">
<header class="bg-white border-b border-slate-100">
  <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="index.html" class="font-extrabold text-slate-900">ATBU BINGE <span class="text-emerald-600 text-xs uppercase tracking-widest">Multi Business</span></a>
    <button id="logout" class="text-sm font-semibold text-slate-600 hover:text-red-600">Log out</button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-8 space-y-8">
  <section class="bg-slate-900 text-white rounded-3xl p-6 sm:p-8">
    <p class="text-sm text-slate-300">Hello, <span id="name">...</span></p>
    <p class="text-xs text-slate-400 mt-1">Track your loan requests below. Approved means the money has been sent to your bank account.</p>
    <a href="index.html#calculator" class="inline-block mt-4 px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-sm font-bold">Apply for a new loan</a>
  </section>

  <section>
    <h2 class="text-lg font-extrabold mb-3">My loan requests</h2>
    <div id="loans" class="space-y-3"></div>
  </section>

</main>

<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const naira = v => '₦' + Number(v).toLocaleString('en-NG', {minimumFractionDigits: 2});
const date = d => new Date(d).toLocaleDateString('en-NG', {day:'numeric', month:'short', year:'numeric'});
const badge = {pending:'bg-amber-100 text-amber-700', approved:'bg-emerald-100 text-emerald-700', rejected:'bg-red-100 text-red-700'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.getElementById('logout').onclick = async () => { await db.auth.signOut(); location.href = 'index.html'; };

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { location.href = 'index.html'; return; }
  const uid = session.user.id;

  const [{ data: profile }, { data: loans }] = await Promise.all([
    db.from('profiles').select('*').eq('id', uid).single(),
    db.from('loan_requests').select('*').eq('user_id', uid).order('created_at', {ascending:false})
  ]);

  document.getElementById('name').textContent = profile?.full_name || session.user.email;

  document.getElementById('loans').innerHTML = (loans?.length ? loans.map(l => `
    <div class="bg-white rounded-2xl border border-slate-100 p-4 flex flex-wrap items-center justify-between gap-2">
      <div>
        <p class="font-bold">${esc(l.category)}</p>
        <p class="text-xs text-slate-500">${naira(l.amount)} · ${l.duration_months} months · ${date(l.created_at)}</p>
        <p class="text-xs text-slate-500">To: ${esc(l.bank_name)} · ${esc(l.account_number)}</p>
        ${l.admin_note ? `<p class="text-xs text-slate-500 mt-1">Note: ${esc(l.admin_note)}</p>` : ''}
      </div>
      <span class="text-xs font-bold px-3 py-1 rounded-full ${badge[l.status]}">${l.status.toUpperCase()}</span>
    </div>`).join('') : '<p class="text-sm text-slate-500">No loan requests yet.</p>');

})();
</script>
</body>
</html>
