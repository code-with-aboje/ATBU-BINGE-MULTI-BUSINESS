<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin - ATBU BINGE MULTI BUSINESS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800">

<!-- Login -->
<div id="loginView" class="min-h-screen flex items-center justify-center p-4">
  <form id="loginForm" class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8 w-full max-w-sm space-y-3">
    <h1 class="text-2xl font-extrabold">Admin login</h1>
    <input id="email" type="email" required placeholder="Email" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm">
    <input id="password" type="password" required placeholder="Password" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 text-sm">
    <p id="loginMsg" class="text-sm text-red-600 hidden"></p>
    <button class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm">Log in</button>
  </form>
</div>

<!-- Dashboard -->
<div id="dashView" class="hidden">
  <header class="bg-white border-b border-slate-100">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <span class="font-extrabold">Admin Dashboard</span>
      <button id="logout" class="text-sm font-semibold text-slate-600 hover:text-red-600">Log out</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6" id="stats"></div>

    <div class="flex gap-2 mb-4 text-sm font-semibold" id="tabs">
      <button data-f="pending" class="px-4 py-2 rounded-xl">Pending</button>
      <button data-f="approved" class="px-4 py-2 rounded-xl">Approved</button>
      <button data-f="rejected" class="px-4 py-2 rounded-xl">Rejected</button>
      <button data-f="all" class="px-4 py-2 rounded-xl">All</button>
    </div>

    <div id="list" class="space-y-3"></div>
  </main>
</div>

<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const naira = v => '₦' + Number(v).toLocaleString('en-NG', {minimumFractionDigits: 2});
const date = d => new Date(d).toLocaleString('en-NG', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge = {pending:'bg-amber-100 text-amber-700', approved:'bg-emerald-100 text-emerald-700', rejected:'bg-red-100 text-red-700'};
let filter = 'pending', all = [];

async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return show('login');
  const { data: p } = await db.from('profiles').select('is_admin').eq('id', session.user.id).single();
  if (!p?.is_admin) {
    await db.auth.signOut();
    show('login'); msg('This account is not an admin.');
    return;
  }
  show('dash');
  load();
}
function show(v){ loginView.classList.toggle('hidden', v!=='login'); dashView.classList.toggle('hidden', v!=='dash'); }
function msg(t){ loginMsg.textContent=t; loginMsg.classList.remove('hidden'); }

loginForm.onsubmit = async e => {
  e.preventDefault();
  const { error } = await db.auth.signInWithPassword({ email: email.value.trim(), password: password.value });
  if (error) return msg(error.message);
  init();
};
logout.onclick = async () => { await db.auth.signOut(); show('login'); };

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });

async function load() {
  const { data, error } = await db.from('loan_requests').select('*').order('created_at', {ascending:false});
  if (error) { list.innerHTML = `<p class="text-red-600 text-sm">${esc(error.message)}</p>`; return; }
  all = data; render();
}

function render() {
  document.querySelectorAll('#tabs button').forEach(b =>
    b.className = 'px-4 py-2 rounded-xl ' + (b.dataset.f === filter ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200'));

  const count = s => all.filter(l => l.status === s).length;
  const credited = all.filter(l => l.status === 'approved').reduce((a, l) => a + Number(l.amount), 0);
  stats.innerHTML = [
    ['Pending', count('pending')], ['Approved', count('approved')],
    ['Rejected', count('rejected')], ['Total sent', naira(credited)]
  ].map(([k, v]) => `<div class="bg-white rounded-2xl border border-slate-100 p-4"><p class="text-xs text-slate-500">${k}</p><p class="text-xl font-extrabold">${v}</p></div>`).join('');

  const rows = filter === 'all' ? all : all.filter(l => l.status === filter);
  list.innerHTML = rows.length ? rows.map(card).join('') : '<p class="text-sm text-slate-500">Nothing here.</p>';
}

function card(l) {
  return `
  <div class="bg-white rounded-2xl border border-slate-100 p-5">
    <div class="flex flex-wrap justify-between gap-2">
      <div>
        <p class="font-extrabold">${esc(l.full_name)} <span class="text-xs font-bold px-2 py-0.5 rounded-full ${badge[l.status]}">${l.status}</span></p>
        <p class="text-xs text-slate-500">${esc(l.email)} · ${esc(l.phone)} · ${date(l.created_at)}</p>
      </div>
      <div class="text-right">
        <p class="text-xl font-extrabold text-emerald-600">${naira(l.amount)}</p>
        <p class="text-xs text-slate-500">${l.duration_months} months · repay ${naira(l.total_repayment)}</p>
      </div>
    </div>
    <div class="grid sm:grid-cols-3 gap-2 text-xs text-slate-600 mt-3">
      <p><b>Category:</b> ${esc(l.category)}</p>
      <p><b>Status:</b> ${esc(l.employment_status)}</p>
      <p><b>NIN/BVN:</b> ${esc(l.id_number)}</p>
    </div>
    <div class="mt-3 bg-emerald-50 border border-emerald-100 rounded-xl p-3 text-sm">
      <p class="text-xs font-bold text-emerald-700 mb-1">SEND MONEY TO</p>
      <p><b>${esc(l.account_number)}</b> · ${esc(l.bank_name)}</p>
      <p class="text-xs text-slate-600">${esc(l.account_name)}</p>
    </div>
    ${l.document_path ? `<button onclick="viewDoc('${esc(l.document_path)}')" class="mt-3 text-xs font-semibold text-emerald-600 underline">View uploaded document</button>` : ''}
    ${l.admin_note ? `<p class="text-xs text-slate-500 mt-2">Note: ${esc(l.admin_note)}</p>` : ''}
    ${l.status === 'pending' ? `
    <div class="flex gap-2 mt-4">
      <button onclick="approve('${l.id}', ${l.amount})" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-xl">I've sent it – Approve</button>
      <button onclick="reject('${l.id}')" class="px-4 py-2 bg-white border border-red-300 text-red-600 text-sm font-bold rounded-xl">Reject</button>
    </div>` : ''}
  </div>`;
}

async function approve(id, amount) {
  if (!confirm(`Confirm you've already sent ${naira(amount)} to this account? The user will see it as Approved.`)) return;
  const { error } = await db.rpc('approve_loan', { p_loan_id: id });
  if (error) alert(error.message);
  load();
}
async function reject(id) {
  const note = prompt('Reason for rejection (optional):');
  if (note === null) return;
  const { error } = await db.rpc('reject_loan', { p_loan_id: id, p_note: note || null });
  if (error) alert(error.message);
  load();
}
async function viewDoc(path) {
  const { data, error } = await db.storage.from('loan-docs').createSignedUrl(path, 120);
  if (error) return alert(error.message);
  window.open(data.signedUrl, '_blank');
}

init();
</script>
</body>
</html>
